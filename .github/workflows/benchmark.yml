name: Benchmark

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frozen-evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -c 'from research.evaluate import verify_frozen; verify_frozen()'
      - run: python -m pytest -q tests/benchmark tests/unit/test_config.py tests/unit/test_rules.py
